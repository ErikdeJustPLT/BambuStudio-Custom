name: Build Custom CLI Version (Linux)

on:
  push:
    branches: [ custom/revert-autoplace-to-nov2025 ]
  workflow_dispatch:

jobs:
  build-linux-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Base Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libxkbcommon-dev

      - name: Build Dependencies
        timeout-minutes: 120
        run: |
          mkdir -p deps/build
          cd deps/build
          cmake .. -DDESTDIR="$HOME/deps_install"
          make -j$(nproc) --keep-going

      - name: Create App Build Directory
        run: mkdir -p build

      - name: Configure CMake (CLI only)
        working-directory: build
        run: |
          cmake .. \
            -DSLIC3R_GUI=OFF \
            -DSLIC3R_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/deps_install/usr/local"

      - name: Build Application
        working-directory: build
        run: cmake --build . -j $(nproc)

      - name: Upload CLI Executable
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio-CLI-Linux
          path: build/src/bambu-studio-console
          retention-days: 30

  create-release:
    needs: build-linux-cli
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v5

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: BambuStudio-CLI-Linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: custom-cli-${{ github.run_number }}
          name: Custom CLI Build #${{ github.run_number }}
          body: |
            Custom Bambu Studio CLI build (Linux) with reverted auto-placement to November 2025 behavior.

            **Changes:**
            - Auto-placement reverted to November 2025
            - GUI disabled (CLI only)
            - Built for Linux

            **Executable:** `bambu-studio-console` (Linux binary)

            **Usage:**
            ```bash
            chmod +x bambu-studio-console
            ./bambu-studio-console [options]
            ```
          draft: false
          prerelease: false
          files: |
            bambu-studio-console
