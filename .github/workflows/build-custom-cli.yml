name: Build Custom CLI Version (Linux)

on:
  push:
    branches: [ custom/revert-autoplace-to-nov2025 ]
  workflow_dispatch:

jobs:
  build-linux-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libboost-all-dev \
            libcgal-dev \
            libopenvdb-dev \
            libtbb-dev \
            libglew-dev \
            libglfw3-dev \
            libcurl4-openssl-dev \
            libudev-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libssl-dev \
            zlib1g-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Verify CMake Installation
        run: cmake --version && gcc --version

      - name: Create Build Directory
        run: mkdir -p build

      - name: Configure CMake (CLI only)
        working-directory: build
        run: |
          cmake .. \
            -DSLIC3R_GUI=OFF \
            -DSLIC3R_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: build
        run: cmake --build . -j $(nproc)

      - name: Upload CLI Executable
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio-CLI-Linux
          path: build/src/bambu-studio-console
          retention-days: 30

  create-release:
    needs: build-linux-cli
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v5

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: BambuStudio-CLI-Linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: custom-cli-${{ github.run_number }}
          name: Custom CLI Build #${{ github.run_number }}
          body: |
            Custom Bambu Studio CLI build (Linux) with reverted auto-placement to November 2025 behavior.

            **Changes:**
            - Auto-placement reverted to November 2025
            - GUI disabled (CLI only)
            - Built for Linux

            **Executable:** `bambu-studio-console` (Linux binary)

            **Usage:**
            ```bash
            chmod +x bambu-studio-console
            ./bambu-studio-console [options]
            ```
          draft: false
          prerelease: false
          files: |
            bambu-studio-console
